file:
  upload:
    dir: ${user.dir}/uploads/
    url-path: /images/

storage:
  type: ${STORAGE_TYPE:local}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:}
    public-url: ${S3_PUBLIC_URL:}

spring:
  config:
    import: "optional:file:./.env"
  task:
    scheduling:
      enabled: true # 스케줄링 기능
  application:
    name: dnc
  servlet:
    multipart:
      # Optional: override temp upload location.
      # location: ${user.home}/uploads
      file-size-threshold: 10MB
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/dnc_db?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:ssafy}
    password: ${DB_PASSWORD:ssafy}
    hikari:
      idle-timeout: 300000
      minimum-idle: 3
      maximum-pool-size: 5
      connection-timeout: 600000
      # data-source-properties:  <-- 로그가 시끄러우면
      #   profileSQL: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false       # SQL 로그 끄기
    properties:
      hibernate:
        format_sql: false # SQL 예쁘게 출력하기도 끄기
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    root: INFO
    org.hibernate.SQL: ERROR        # 쿼리 로그는 에러 날 때만!
    org.hibernate.type: ERROR       # 파라미터 값 로그 숨기기
    com.zaxxer.hikari: ERROR        # DB 연결 로그 숨기기
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET:9c2f4d1a7b8e3c6f5a0d2b7e9f1c4a8d9b6e3a0c5f2d0y5s}
  expiration_time: ${JWT_EXPIRATION_TIME:3600000} # 1 hour
  refresh_expiration_time: ${JWT_REFRESH_EXPIRATION_TIME:604800000} # 7 days

oauth:
  providers:
    dexcom:
      client-id: ${DEXCOM_CLIENT_ID:7KaRpwoqMFGyYsLFcmH0DSiiiGkLhsdX}
      client-secret: ${DEXCOM_CLIENT_SECRET:bPQO4Ul2XDEqGKY9}
      redirect-uri: ${DEXCOM_REDIRECT_URI:http://localhost:8080/api/v1/oauth/dexcom/callback}
      auth-uri: ${DEXCOM_AUTH_URI:https://sandbox-api.dexcom.com/v3/oauth2/login}
      token-uri: ${DEXCOM_TOKEN_URI:https://sandbox-api.dexcom.com/v3/oauth2/token}
      api-base: ${DEXCOM_API_BASE:https://sandbox-api.dexcom.com/v3}
      scopes:
        - offline_access
    caresense:
      client-id: ${CARESENSE_CLIENT_ID:}
      client-secret: ${CARESENSE_CLIENT_SECRET:}
      redirect-uri: ${CARESENSE_REDIRECT_URI:http://localhost:8080/api/v1/oauth/caresense/callback}
      auth-uri: ${CARESENSE_AUTH_URI:}
      token-uri: ${CARESENSE_TOKEN_URI:}
      scopes: []
