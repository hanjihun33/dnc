file:
  upload:
    dir: ${user.dir}/uploads/
    url-path: /images/

spring:
  application:
    name: dnc
  servlet:
    multipart:
      # Optional: override temp upload location.
      # location: ${user.home}/uploads
      file-size-threshold: 10MB
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/dnc_db?serverTimezone=UTC}
    username: ${DB_USERNAME:ssafy}
    password: ${DB_PASSWORD:}
    hikari:
      idle-timeout: 300000
      minimum-idle: 3
      maximum-pool-size: 5
      connection-timeout: 600000
      data-source-properties:
        profileSQL: true

jwt:
  secret: ${JWT_SECRET}
  expiration_time: ${JWT_EXPIRATION_TIME:3600000}

oauth:
  providers:
    dexcom:
      client-id: ${DEXCOM_CLIENT_ID:}
      client-secret: ${DEXCOM_CLIENT_SECRET:}
      redirect-uri: ${DEXCOM_REDIRECT_URI:http://localhost:8080/api/v1/oauth/dexcom/callback}
      auth-uri: ${DEXCOM_AUTH_URI:https://sandbox-api.dexcom.com/v2/oauth2/login}
      token-uri: ${DEXCOM_TOKEN_URI:https://sandbox-api.dexcom.com/v2/oauth2/token}
      scopes:
        - offline_access
        - readings
    caresense:
      client-id: ${CARESENSE_CLIENT_ID:}
      client-secret: ${CARESENSE_CLIENT_SECRET:}
      redirect-uri: ${CARESENSE_REDIRECT_URI:http://localhost:8080/api/v1/oauth/caresense/callback}
      auth-uri: ${CARESENSE_AUTH_URI:}
      token-uri: ${CARESENSE_TOKEN_URI:}
      scopes: []
