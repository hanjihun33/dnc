file:
  upload:
    dir: ${user.dir}/uploads/
    url-path: /images/

spring:
  application:
    name: dnc
  servlet:
    multipart:
      # Optional: override temp upload location.
      # location: ${user.home}/uploads
      file-size-threshold: 10MB
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/dnc_db?serverTimezone=UTC}
    username: ${DB_USERNAME:ssafy}
    password: ${DB_PASSWORD:}
    hikari:
      idle-timeout: 300000
      minimum-idle: 3
      maximum-pool-size: 5
      connection-timeout: 600000
      data-source-properties:
        profileSQL: true

jwt:
  secret: ${JWT_SECRET}
  expiration_time: ${JWT_EXPIRATION_TIME:3600000}
