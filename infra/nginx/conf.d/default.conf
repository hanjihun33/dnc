server {
    listen 80;
    server_name i14c105.p.ssafy.io;

    # 모든 HTTP 요청을 HTTPS로 강제 리다이렉트
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name i14c105.p.ssafy.io;

    client_max_body_size 20M;  # 이미지 업로드를 위해 20MB로 증설
    proxy_read_timeout 300;    # AI 분석 등 긴 작업 대기를 위해 5분(300초)으로 증설

    # 발급받은 인증서 경로 (컨테이너 내부 경로)
    ssl_certificate /etc/letsencrypt/live/i14c105.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i14c105.p.ssafy.io/privkey.pem;

    # 보안 설정 (권장)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 2. 백엔드 기존 /api/ 요청과 함께 swagger, v3 경로도 백엔드로 보냄
    location ~ ^/(api|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:18080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 설정 추가
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 3. AI 서버 (FastAPI)
    location /ai/ {
        # 보안 설정: .htpasswd 경로 확인
        auth_basic "Team Dujjokko Only";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # 서비스 이름 'ai'와 포트 18000 사용
        proxy_pass http://ai:18000/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }   

    # Nginx 설정 파일 내부
    location /jenkins/ {
        proxy_pass http://jenkins-controller:8080/jenkins/;
        
        # [기존 설정 유지]
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # [추가 권장] 80번 포트로 들어오고 있음을 명시
        proxy_set_header X-Forwarded-Port 80;
        
        # 리다이렉트 시 포트 꼬임 방지
        proxy_redirect off;

        # 웹소켓 지원 (기존 설정 유지)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

        # 1. 프론트엔드 (기본 접속)
    location / {
        # 서비스 이름 'frontend'와 포트 180 사용
        proxy_pass http://frontend:180; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}